<html manifest="cache.appcache">
<head>
<title>KYAT_NGUYEN - PS4 EXPLOIT</title>
<style>
body {
    background: #0b0d10 url("background.png") no-repeat center center fixed;
    background-size: cover;
    color: #ffffff;
    font-size: 20px;
    text-align: center;
    margin: 0;
    overflow: hidden;
}
.info {
    position: absolute;
    top: 45%;
    left: 50%;
    font-size: 22px;
    font-family: monospace;
    color: #ffffff;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9), 0 0 10px rgba(0, 0, 0, 0.7);
    transform: translate(-50%, -50%);
}
</style>
<script>
history.replaceState(null, null, 'index.html');
var histlength = history.length;
history.go(-histlength);

function DLProgress(e) {
    var pct = Math.round(e.loaded / e.total * 100);
    msgs.innerHTML = "mansoor0x &middot; Installing ... " + pct + "%";
}

function DisplayCacheProgress() {
    setTimeout(function () {
        msgs.innerHTML = "mansoor0x &middot; Cache OK";
    }, 2000);
    setTimeout(function () {
        location.reload();
    }, 3000);
}

window.applicationCache.addEventListener("progress",    DLProgress,           false);
window.applicationCache.oncached     = function (e) { DisplayCacheProgress(); };
window.applicationCache.onupdateready = function (e) { DisplayCacheProgress(); };
</script>
</head>
<body>
<div id="msgs" class="info"></div>
</body>
</html>
